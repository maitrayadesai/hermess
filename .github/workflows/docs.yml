name: docs

# Builds the Sphinx documentation and publishes it to GitHub Pages
# (https://maitrayadesai.github.io/hermess/) on every push to main.

on:
  push:
    branches: ["main"]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# Allow one docs deployment at a time; do not cancel a running one.
concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    env:
      # Never pick an interactive matplotlib backend: the build imports the
      # package, and a GUI backend makes it hang waiting for a window.
      MPLBACKEND: Agg
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install the package and the documentation dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -e .
          pip install sphinx sphinx-rtd-theme sphinx-autoapi \
                      sphinx-autodoc-typehints nbsphinx

      - name: Build the HTML documentation
        run: sphinx-build -b html docs/source _site

      - name: Keep GitHub Pages from stripping the _static directory
        run: touch _site/.nojekyll

      - uses: actions/configure-pages@v5

      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
