name: tests

# Continuous integration for hermess. Uses uv with the committed lockfile for
# the test run, and separately builds the package and installs the wheel into
# a clean environment to catch packaging regressions.

on:
  push:
    branches: ["**"]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v6
        with:
          python-version: "3.10"

      - name: Install package and test dependencies
        run: uv sync --locked --no-default-groups --group test

      - name: Run tests
        run: uv run --no-sync pytest -q

  package:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v6
        with:
          python-version: "3.10"

      - name: Build sdist and wheel
        run: uv build

      - name: Install the wheel into a clean environment
        run: |
          uv venv smoke
          VIRTUAL_ENV=$PWD/smoke uv pip install dist/*.whl
          smoke/bin/python -c "import hermess"
