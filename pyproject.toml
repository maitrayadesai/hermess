[project]
name = "hermess"
version = "1.0.0"
description = "Hybrid EMT/RMS Modern Electric power System Simulator"
readme = "README.md"
license = "GPL-3.0-or-later"
requires-python = ">=3.10"
authors = [
    { name = "Milos Katanic", email = "mkatanic@ethz.ch" },
    { name = "Maitraya Avadhut Desai", email = "mdesai@ethz.ch" },
]
maintainers = [
    { name = "Maitraya Avadhut Desai", email = "mdesai@ethz.ch" },
]
keywords = ["power systems", "dynamic simulation", "DAE", "grid-forming converters", "small-signal stability"]
classifiers = [
    "Intended Audience :: Science/Research",
    "Topic :: Scientific/Engineering",
    "Programming Language :: Python :: 3",
    "Operating System :: OS Independent",
]

[project.urls]
Repository = "https://github.com/maitrayadesai/hermess"
Issues = "https://github.com/maitrayadesai/hermess/issues"

[tool.poetry]
name = "hermess"
version = "1.0.0"
description = "Hybrid EMT/RMS Modern Electric power System Simulator"
authors = ["Milos Katanic <mkatanic@ethz.ch>", "Maitraya Avadhut Desai <mdesai@ethz.ch>"]
maintainers = ["Maitraya Avadhut Desai <mdesai@ethz.ch>"]
readme = "README.md"
exclude = ["coverage_reports/"]
license = "GPL-3.0-or-later"
repository = "https://github.com/maitrayadesai/hermess"

[tool.poetry.dependencies]
python = "^3.10"
scipy = "^1.12.0"
matplotlib = "^3.8.3"
casadi = "^3.6.5"
tabulate = "^0.9.0"
numpy = "^2.2.4"
pandas = "^2.2.3"
pydantic = "^2.10.3"
tqdm = "^4.66.0"


[tool.poetry.group.dev.dependencies]
pytest = "^8.3.3"
pytest-cov = "^5.0.0"
sphinx = "^8.1.3"
sphinx-rtd-theme = "^3.0.2"
sphinx-autodoc-typehints = "^3.0.1"
sphinxcontrib-napoleon = "^0.7"
ipykernel = "^6.29.5"
nbconvert = "^7.16.6"
nbclient = "^0.10.2"
flake8 = "^7.2.0"
pre-commit = "^4.2.0"
black = "^25.1.0"
sphinx-autoapi = "^3.6.0"
nbsphinx = "^0.9.7"

[build-system]
requires = ["poetry-core"]
build-backend = "poetry.core.masonry.api"

[tool.pytest.ini_options]
pythonpath = "hermess"
addopts = [
    "--import-mode=importlib",
]

[tool.poetry.scripts]
main = "hermess.main:main"
hermess = "hermess.__main__:main"



