name: docs

# Builds the Sphinx documentation and publishes it to GitHub Pages
# (https://maitrayadesai.github.io/hermess/) on every push to main.
# Pull requests get the build as a check, without deploying.

on:
  push:
    branches: ["main"]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# Allow one docs deployment at a time; do not cancel a running one.
concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  build:
    # No MPLBACKEND override here: conf.py drops it anyway so the notebook
    # kernels can use the inline backend, and a headless runner falls back to
    # Agg on its own.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install pandoc (nbsphinx converts notebook markdown with it)
        run: sudo apt-get update && sudo apt-get install -y pandoc

      - name: Set up uv
        uses: astral-sh/setup-uv@v5
        with:
          python-version: "3.12"

      - name: Install the package and the documentation dependencies
        run: uv sync --locked --group docs

      - name: Build the HTML documentation
        run: uv run sphinx-build -W --keep-going -b html docs/source _site

      - name: Keep GitHub Pages from stripping the _static directory
        run: touch _site/.nojekyll

      - if: github.event_name != 'pull_request'
        uses: actions/configure-pages@v5

      - if: github.event_name != 'pull_request'
        uses: actions/upload-pages-artifact@v3
        with:
          path: _site

  deploy:
    if: github.event_name != 'pull_request'
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
