name: publish

# Publishes hermess to PyPI when a GitHub release is published. Uses PyPI
# trusted publishing (OIDC), so no API token is stored in the repository.
# One-time setup on https://pypi.org: add a "trusted publisher" for this
# repository with workflow name publish.yml and environment pypi.

on:
  release:
    types: [published]

jobs:
  publish:
    runs-on: ubuntu-latest
    environment: pypi
    permissions:
      id-token: write
    steps:
      - uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v6

      - name: Build sdist and wheel
        run: uv build

      - name: Publish to PyPI
        run: uv publish --trusted-publishing always
