[project]
name = "hermess"
version = "1.6.0"
description = "Hybrid EMT/RMS Modern Electric power System Simulator"
readme = "README.md"
license = "GPL-3.0-or-later"
license-files = ["LICENSE.txt", "AUTHORS"]
requires-python = ">=3.10"
authors = [
    { name = "Milos Katanic", email = "mkatanic@ethz.ch" },
    { name = "Maitraya Avadhut Desai", email = "mdesai@ethz.ch" },
]
maintainers = [
    { name = "Maitraya Avadhut Desai", email = "mdesai@ethz.ch" },
]
keywords = ["power systems", "dynamic simulation", "DAE", "grid-forming converters", "small-signal stability"]
classifiers = [
    "Intended Audience :: Science/Research",
    "Topic :: Scientific/Engineering",
    "Programming Language :: Python :: 3",
    "Operating System :: OS Independent",
]
dependencies = [
    "numpy>=2.2.4",
    "scipy>=1.12.0",
    "casadi>=3.6.5",
    "matplotlib>=3.8.3",
    "pandas>=2.2.3",
    "pydantic>=2.10.3",
    "tabulate>=0.9.0",
    "tqdm>=4.66.0",
]

[project.optional-dependencies]
gui = ["pyside6>=6.6", "pyqtgraph>=0.13.7"]

[project.scripts]
hermess = "hermess.__main__:main"
hermess-gui = "hermess.gui.app:main"

[project.urls]
Repository = "https://github.com/maitrayadesai/hermess"
Issues = "https://github.com/maitrayadesai/hermess/issues"
Documentation = "https://maitrayadesai.github.io/hermess/"

# PEP 735 dependency groups (dev tooling; not part of the published package).
# `validation` adds the reference tools used to regenerate
# hermess/tests/references/; the tests themselves only compare the committed
# CSVs and need nothing beyond `test`.
[dependency-groups]
test = ["pytest>=8.3.3", "pytest-cov>=5.0.0"]
validation = [{ include-group = "test" }, "andes>=1.9.3"]
docs = [
    "sphinx>=8.1.3",
    "shibuya>=2025.7.24",
    "sphinx-autodoc-typehints>=3.0.1",
    "sphinx-autoapi>=3.6.0",
    "sphinx-copybutton>=0.5.2",
    "sphinx-argparse>=0.5",
    "sphinx-reredirects>=0.1.5",
    "myst-parser>=4.0",
    "nbsphinx>=0.9.7",
    "ipykernel>=6.29.5",
    "sphinx-sitemap>=2.6",
]
dev = [
    { include-group = "test" },
    { include-group = "docs" },
    "flake8>=7.2.0",
    "black>=25.1.0",
    "pre-commit>=4.2.0",
    "ipykernel>=6.29.5",
    "nbconvert>=7.16.6",
    "nbclient>=0.10.2",
]

[build-system]
requires = ["uv_build>=0.10.0,<0.11.0"]
build-backend = "uv_build"

[tool.uv.build-backend]
# Flat layout: the package lives at ./hermess, not ./src/hermess.
module-root = ""
# Ship tests in the sdist (repo mirror) but keep them out of installed wheels;
# references/ alone is 8 MB of CSVs.
wheel-exclude = ["hermess/tests/**"]

[tool.pytest.ini_options]
pythonpath = "hermess"
addopts = [
    "--import-mode=importlib",
]
